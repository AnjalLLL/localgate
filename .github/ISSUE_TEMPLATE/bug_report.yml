name: Bug report
description: Report a bug
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include error output if any.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: version
    attributes:
      label: localgate version
      description: Output of `localgate --version`
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: OS and Python version
    validations: { required: true }
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [Ollama, llama.cpp, vLLM, OpenAI-compatible, Other]
