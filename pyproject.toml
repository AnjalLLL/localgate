[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localgate"
version = "0.14.0"
description = "A local-first API gateway for open-source LLMs: auth, RAG memory extension, DB connectors, token accounting, and a built-in coding agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anjal Ghimire", email = "anjalghimire890@gmail.com" }]
keywords = [
    "llm",
    "ollama",
    "rag",
    "api-gateway",
    "self-hosted",
    "local-first",
    "vllm",
    "llama-cpp",
    "coding-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "mcp>=1.0",
    "caniollama>=0.1.0",
    "cryptography>=42",
    "segno>=1.6",  # QR codes for the dashboard's Share page (pure Python, no deps)
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
# Rate limits and per-key concurrency shared across worker processes (LOCALGATE_REDIS_URL).
redis = ["redis>=5"]
# Local voice: Piper TTS (GPL-3.0, optional) and faster-whisper STT.
voice = [
  "piper-tts>=1.3",
  # onnxruntime (via piper) stopped shipping Python 3.10 wheels at 1.24.
  "onnxruntime>=1.17,<1.24; python_version < '3.11'",
  "faster-whisper>=1.1",
  "sounddevice>=0.4",
  "numpy>=1.24",
  "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "asyncpg>=0.29",
]

[project.scripts]
localgate = "localgate.cli:app"

[project.urls]
Homepage = "https://github.com/AnjalLLL/localgate"
Documentation = "https://github.com/AnjalLLL/localgate/tree/main/docs"
Repository = "https://github.com/AnjalLLL/localgate"
Issues = "https://github.com/AnjalLLL/localgate/issues"
Changelog = "https://github.com/AnjalLLL/localgate/blob/main/CHANGELOG.md"

# Third-party backends register themselves under this entry-point group; see
# docs/architecture.md for the contract. The built-ins are registered the same
# way so there is no privileged path a plugin can't take.
[project.entry-points."localgate.backends"]
ollama = "localgate.backends.ollama:OllamaBackend"
vllm = "localgate.backends.vllm:VLLMBackend"
llamacpp = "localgate.backends.llamacpp:LlamaCppBackend"
openai_compat = "localgate.backends.openai_compat:OpenAICompatBackend"
localgate = "localgate.backends.localgate_remote:LocalgateBackend"
fake = "localgate.backends.fake:FakeBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/localgate"]
# Non-Python files the installed package needs at *runtime*, declared explicitly
# rather than relying on the default file selection. Both failure modes are silent
# until a user hits them: without alembic.ini + versions/, `localgate serve` dies
# on startup building the Alembic config; without index.html, `mount_dashboard()`
# returns False and /dashboard 404s with nothing in the logs.
# `tests/unit/test_packaging.py` asserts these actually land in a built wheel.
artifacts = [
  "src/localgate/py.typed",
  "src/localgate/db/migrations/alembic.ini",
  "src/localgate/db/migrations/script.py.mako",
  "src/localgate/db/migrations/versions/*.py",
  "src/localgate/dashboard/static/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008 forbids function calls in argument defaults. `Depends(...)` in a default is
# how FastAPI declares dependencies — the rule does not know that, and following it
# would mean abandoning the framework's core idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: builds a wheel or otherwise shells out; deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["src/localgate"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
packages = ["localgate"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tiktoken.*", "prometheus_client.*"]
ignore_missing_imports = true

# Optional voice extra: untyped packages, treated as `Any`.
[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "piper", "piper.*", "av"]
ignore_missing_imports = true
follow_imports = "skip"

# A dependency imports numpy.typing; with the voice extra installed, numpy's stubs
# (Python 3.12 syntax) would otherwise break type-checking at our 3.10 floor.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
